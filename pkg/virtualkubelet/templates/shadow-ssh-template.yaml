{{- /* ssh client options for the login hop, shared by every ssh the shadow runs
against the login node. Delegation comes after ExtraOptions, so that
GSSAPIDelegateCredentials=yes there turns it back on. It is on only for the
reverse tunnel's srun carrier, because srun on the login node needs the ticket. */ -}}
{{- define "sshOptions" -}}
ssh_opts="\
              -p {{.SSH.Port}} \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
            {{- if eq .SSH.Auth "kerberos" }}
              -o GSSAPIAuthentication=yes \
              -o PreferredAuthentications=gssapi-with-mic \
            {{- else }}
              -i /interlink/ssh/{{.SSH.KeySecretKey}} \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
            {{- end }}
            {{- if .SSH.KnownHostsConfigMap }}
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/interlink/known-hosts/known_hosts \
            {{- else }}
              -o StrictHostKeyChecking=accept-new \
            {{- end }}
            {{- range .SSH.ExtraOptions }}
              -o {{.}} \
            {{- end }}
            {{- if eq .SSH.Auth "kerberos" }}
              -o GSSAPIDelegateCredentials={{if and .Reverse (eq .Reverse.NodeExec "srun")}}yes{{else}}no{{end}} \
            {{- end }}
              "
{{- end -}}
{{- /* ssh client options for a session on the compute node's own sshd. Expanded
after $w is set; delegation is always off on this hop. */ -}}
{{- define "nodeOptions" -}}
node_opts="\
                -p 22 \
                -o BatchMode=yes \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=3 \
              {{- if eq .SSH.Auth "kerberos" }}
                -o GSSAPIAuthentication=yes \
                -o GSSAPIDelegateCredentials=no \
                -o PreferredAuthentications=gssapi-with-mic \
              {{- else }}
                -i /interlink/ssh/{{.SSH.KeySecretKey}} \
                -o IdentitiesOnly=yes \
                -o PreferredAuthentications=publickey \
              {{- end }}
                -o UserKnownHostsFile=$w/node_known_hosts \
                -o StrictHostKeyChecking={{if eq .SSH.NodeHostKeys "accept-new"}}accept-new{{else}}yes{{end}} \
                -o ProxyCommand=$w/node-proxy \
              {{- range .SSH.ExtraOptions }}
                -o {{.}} \
              {{- end }}
                "
{{- end -}}
{{- define "nodeHop" -}}
{{- $srun := and .Reverse (eq .Reverse.NodeExec "srun") -}}
{{- if $srun -}}
# The plugin names the batch job after the pod UID. Steps are pinned to the
            # batch host, where the job's relay and socket directory are.
            job_id() {
              # shellcheck disable=SC2086
              out=$(ssh $ssh_opts "$target" "squeue -h --me -t R -n $REV_JOB_NAME -o '%i %B'" 2>/dev/null | head -n 1)
              jid=${out%% *} bhost=${out#"$jid"} bhost=${bhost# }
              echo "$jid" | grep -Eq '^[0-9]+$' || { echo "no running job named $REV_JOB_NAME" >&2; return 1; }
              echo "$bhost" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' || { echo "no batch host for job $jid" >&2; return 1; }
            }

            {{ end -}}
# $w/node-proxy carries a session to the compute node's own sshd through the login
            # node; $w/node_known_hosts is what that session is checked against.
            node_hop() {
              : > "$w/node_known_hosts"
            {{- if .SSH.KnownHostsConfigMap }}
              cat /interlink/known-hosts/known_hosts >> "$w/node_known_hosts"
              # A ConfigMap value may lack its final newline: keep the next file's
              # first line from joining its last one.
              echo >> "$w/node_known_hosts"
            {{- end }}
            {{- if eq .SSH.NodeHostKeys "verify" }}
              # The login node's own list of node keys, often one @cert-authority line.
              # shellcheck disable=SC2086
              ssh $ssh_opts "$target" 'cat /etc/ssh/ssh_known_hosts /etc/ssh/ssh_known_hosts2' \
                >> "$w/node_known_hosts" 2>/dev/null || true
              ssh-keygen -F "$node" -f "$w/node_known_hosts" >/dev/null 2>&1 ||
                grep -q '^@cert-authority' "$w/node_known_hosts" ||
                echo "no host key for $node: add its key, a host pattern or an @cert-authority line to KnownHostsConfigMap, or set NodeHostKeys: accept-new" >&2
            {{- else }}
              echo "WARNING: the host key of $node is not verified (NodeHostKeys: accept-new)" >&2
            {{- end }}
            {{- if $srun }}
              if [ "${1:-ssh}" = srun ]; then
                job_id || return 1
                printf '#!/bin/sh\nexec ssh %s %s "srun --jobid=%s --overlap -u -n1 -w %s --cpus-per-task=1 %s 127.0.0.1 22"\n' \
                  "$ssh_opts" "$target" "$jid" "$bhost" "$connect_cmd" > "$w/node-proxy"
                chmod +x "$w/node-proxy"
                return
              fi
            {{- end }}
            {{- if eq .SSH.ForwardMode "exec" }}
              printf '#!/bin/sh\nexec ssh %s %s "%s %s 22"\n' "$ssh_opts" "$target" "$connect_cmd" "'$node'" > "$w/node-proxy"
            {{- else }}
              # ssh -W needs an IPv6 address in brackets to tell it from the port.
              case $node in *:*) w_node="[$node]" ;; *) w_node=$node ;; esac
              printf '#!/bin/sh\nexec ssh %s -W %s:22 %s\n' "$ssh_opts" "$w_node" "$target" > "$w/node-proxy"
            {{- end }}
              chmod +x "$w/node-proxy"
            }
{{- end -}}
{{- /* nothing to forward without a TCP port: no forward container, no Service */ -}}
{{- $hasTCP := false }}
{{- range .ExposedPorts }}{{ if ne .Protocol "UDP" }}{{ $hasTCP = true }}{{ end }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{.Name}}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{.Name}}
    spec:
      # Never schedule the shadow onto the virtual node it shadows: real nodes are
      # kubernetes.io/os=linux, the virtual one is kubernetes.io/os=virtual-kubelet.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      initContainers:
      # The remote job is usually still queued when the shadow starts, so the pod
      # sits in Init until the plugin reports which node it landed on. That is the
      # expected path, not a failure: it reads as "waiting for the allocation"
      # instead of a crash-looping tunnel.
      - name: wait-for-node
        image: {{.SSH.Image}}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            deadline=$(( $(date +%s) + {{.SSHNodeWaitSeconds}} ))
            while :; do
              node=$(tr -d '[:space:]' < /interlink/node/{{.NodeNameKey}} 2>/dev/null || true)
              [ -n "$node" ] && break
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "timed out after {{.SSH.NodeWaitTimeout}} waiting for the plugin to report a compute node." >&2
                echo "The plugin must return PodStatus.NodeName once the job runs; plugins that do not are unsupported by the ssh shadow." >&2
                exit 1
              fi
              sleep 5
            done
            echo "compute node: $node"
            {{- if .NeedsSocketDir }}
            told=false
            until sd=$(tr -d '[:space:]' < /interlink/node/{{.SocketDirKey}} 2>/dev/null || true); [ -n "$sd" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "timed out waiting for a socket directory: the plugin must set SocketDirRoot" >&2
                exit 1
              fi
              $told || { echo "waiting for the plugin to report a socket directory (plugins without SocketDirRoot never do)"; told=true; }
              sleep 5
            done
            echo "socket directory: $sd"
            {{- end }}
        volumeMounts:
        - name: shadow-node
          mountPath: /interlink/node
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      {{- if eq .SSH.Auth "kerberos" }}
      # Runs after the node is known so the ticket is fresh when ssh starts, however
      # long the job waited in the queue.
      - name: kinit
        image: {{.SSH.Image}}
        command: ["/bin/sh", "-c"]
        args:
          - kinit -k -t /interlink/keytab/{{.SSH.KeytabSecretKey}} {{.SSH.Principal}}
        env:
        - name: KRB5CCNAME
          value: FILE:/interlink/krb5cc/ccache
        volumeMounts:
        - name: shadow-keytab
          mountPath: /interlink/keytab
          readOnly: true
        - name: shadow-krb5cc
          mountPath: /interlink/krb5cc
        {{- if .SSH.Krb5ConfigMap }}
        - name: shadow-krb5-config
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      {{- end }}
      containers:
      {{- if eq .SSH.Auth "kerberos" }}
      - name: kinit-renew
        image: {{.SSH.Image}}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            while :; do
              sleep 21600
              kinit -k -t /interlink/keytab/{{.SSH.KeytabSecretKey}} {{.SSH.Principal}} || true
            done
        env:
        - name: KRB5CCNAME
          value: FILE:/interlink/krb5cc/ccache
        volumeMounts:
        - name: shadow-keytab
          mountPath: /interlink/keytab
          readOnly: true
        - name: shadow-krb5cc
          mountPath: /interlink/krb5cc
        {{- if .SSH.Krb5ConfigMap }}
        - name: shadow-krb5-config
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
        {{- end }}
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      {{- end }}
      {{- if $hasTCP }}
      - name: ssh-forward
        image: {{.SSH.Image}}
        command: ["/bin/sh", "-c"]
        args:
          - |
            {{- if eq .SSH.ForwardTarget "node" }}
            set -u
            read_node() { tr -d '[:space:]' < /interlink/node/{{.NodeNameKey}} 2>/dev/null || true; }
            read_sockdir() { tr -d '[:space:]' < /interlink/node/{{.SocketDirKey}} 2>/dev/null || true; }

            target={{.SSH.User}}@{{.SSH.LoginHost}}
            {{- if eq .SSH.ForwardMode "exec" }}
            connect_cmd='{{.SSH.ExecConnectCommand}}'
            {{- end }}
            w=/tmp/interlink-forward
            {{ template "sshOptions" . }}

            {{ template "nodeHop" . }}

            pids=

            start_forwarders() {
              rm -rf "$w"
              mkdir -p "$w"
              {{ template "nodeOptions" . }}
              node_hop || return 1

              # One -L per port, opened by the node's own sshd to 127.0.0.1 or to a
              # socket in the job's directory, so the workload never listens on the
              # network. ForwardMode only decides how the login node relays the
              # session to the node (see node_hop).
              # shellcheck disable=SC2086
              ssh -N -o ExitOnForwardFailure=yes $node_opts \
              {{- range .ExposedPorts }}
              {{- if ne .Protocol "UDP" }}
              {{- if .Socket }}
                -L "0.0.0.0:{{.Port}}:$sd/fwd-{{.Port}}.sock" \
              {{- else }}
                -L "0.0.0.0:{{.Port}}:127.0.0.1:{{.Port}}" \
              {{- end }}
              {{- end }}
              {{- end }}
                "{{.SSH.User}}@$node" &
              pids=$!
            }

            all_alive() {
              for pid in $pids; do
                kill -0 "$pid" 2>/dev/null || return 1
              done
              return 0
            }

            stop_forwarders() {
              for pid in $pids; do
                kill "$pid" 2>/dev/null || true
              done
              wait 2>/dev/null || true
              pids=
            }

            # A requeued job comes back on a different host, and the virtual kubelet
            # republishes the node and the socket directory into the mounted ConfigMap.
            moved() {
              cur=$(read_node)
              cur_sd=$(read_sockdir)
              [ -n "$cur" ] || return 1
              [ "$cur" != "$node" ] || { [ -n "$cur_sd" ] && [ "$cur_sd" != "$sd" ]; }
            }

            node=$(read_node)
            sd=$(read_sockdir)
            [ -n "$node" ] || { echo "no compute node recorded" >&2; exit 1; }
            {{- if .NeedsSocketDir }}
            [ -n "$sd" ] || { echo "no socket directory reported: set SocketDirRoot in the plugin" >&2; exit 1; }
            {{- end }}

            while :; do
              echo "forwarding{{range .ExposedPorts}}{{if ne .Protocol "UDP"}} {{.Port}}{{end}}{{end}} to $node through {{.SSH.LoginHost}} (node target, {{.SSH.ForwardMode}} mode)"
              if start_forwarders; then
                while all_alive && ! moved; do sleep 10; done
              fi
              stop_forwarders

              if moved; then
                echo "compute node or socket directory changed, rebuilding the tunnel"
                node=$cur
                [ -n "$cur_sd" ] && sd=$cur_sd
                continue
              fi
              # A requeued job does not run on $node yet, so its sshd refuses us: retry
              # here rather than crash-loop into minutes of back-off.
              echo "the tunnel to $node is down; retrying in 30s" >&2
              sleep 30
            done
            {{- else }}
            set -u
            read_node() { tr -d '[:space:]' < /interlink/node/{{.NodeNameKey}} 2>/dev/null || true; }

            target={{.SSH.User}}@{{.SSH.LoginHost}}
            {{ template "sshOptions" . }}

            pids=

            {{- if eq .SSH.ForwardMode "exec" }}
            # One local listener per port, each accepted connection relayed by a
            # command run on the login node. Nothing here asks sshd to forward
            # anything, which is the point: it works where AllowTcpForwarding is off.
            forward_dir=/tmp/interlink-forward
            control="$forward_dir/master"
            connect_cmd='{{.SSH.ExecConnectCommand}}'

            start_forwarders() {
              mkdir -p "$forward_dir"
              rm -f "$control"

              # Every relayed stream rides one multiplexed SSH connection, so opening a
              # connection costs a channel rather than a full handshake, and the login
              # node sees a single session instead of one per connection.
              # shellcheck disable=SC2086
              ssh -M -N -o ControlMaster=yes -o ControlPath="$control" -o ControlPersist=no $ssh_opts "$target" &
              pids=$!

              # Quoted for the login node's shell, which re-parses whatever ssh sends it.
              remote_cmd="$connect_cmd '$node'"

              waited=0
              # shellcheck disable=SC2086
              until ssh -O check -o ControlPath="$control" $ssh_opts "$target" >/dev/null 2>&1; do
                waited=$((waited + 1))
                if [ "$waited" -ge 30 ]; then
                  echo "the ssh control master did not come up" >&2
                  return 1
                fi
                sleep 1
              done
              {{- range .ExposedPorts }}
              {{- if ne .Protocol "UDP" }}

              printf '#!/bin/sh\nexec ssh -q -o ControlMaster=auto -o ControlPath=%s %s %s "%s {{.Port}}"\n' \
                "$control" "$ssh_opts" "$target" "$remote_cmd" > "$forward_dir/{{.Port}}"
              chmod +x "$forward_dir/{{.Port}}"
              socat TCP-LISTEN:{{.Port}},fork,reuseaddr,bind=0.0.0.0 EXEC:"$forward_dir/{{.Port}}" &
              pids="$pids $!"
              {{- end }}
              {{- end }}
            }
            {{- else }}
            # One -L per port. The login node must set AllowTcpForwarding yes for this
            # account, or every channel is refused with "administratively prohibited".
            start_forwarders() {
              # shellcheck disable=SC2086
              ssh -N -o ExitOnForwardFailure=yes $ssh_opts \
              {{- range .ExposedPorts }}
              {{- if ne .Protocol "UDP" }}
                -L "0.0.0.0:{{.Port}}:$node:{{.Port}}" \
              {{- end }}
              {{- end }}
                "$target" &
              pids=$!
            }
            {{- end }}

            all_alive() {
              for pid in $pids; do
                kill -0 "$pid" 2>/dev/null || return 1
              done
              return 0
            }

            stop_forwarders() {
              for pid in $pids; do
                kill "$pid" 2>/dev/null || true
              done
              wait 2>/dev/null || true
              pids=
            }

            node=$(read_node)
            [ -n "$node" ] || { echo "no compute node recorded" >&2; exit 1; }

            # A requeued job comes back on a different host and the virtual kubelet
            # republishes it into the mounted ConfigMap, but the running forwarders
            # still hold the old name. Watch for the change and rebuild them.
            while :; do
              echo "forwarding{{range .ExposedPorts}}{{if ne .Protocol "UDP"}} {{.Port}}{{end}}{{end}} to $node via {{.SSH.LoginHost}} ({{.SSH.ForwardMode}} mode)"
              if ! start_forwarders; then
                stop_forwarders
                exit 1
              fi

              changed=false
              while all_alive; do
                current=$(read_node)
                if [ -n "$current" ] && [ "$current" != "$node" ]; then
                  echo "compute node changed from $node to $current, rebuilding the tunnel"
                  node=$current
                  changed=true
                  break
                fi
                sleep 10
              done

              stop_forwarders
              $changed && continue

              current=$(read_node)
              if [ -n "$current" ] && [ "$current" != "$node" ]; then
                node=$current
                continue
              fi
              echo "the tunnel exited; letting Kubernetes restart the container" >&2
              exit 1
            done
            {{- end }}
        {{- if eq .SSH.Auth "kerberos" }}
        env:
        - name: KRB5CCNAME
          value: FILE:/interlink/krb5cc/ccache
        {{- end }}
        ports:
        {{- range .ExposedPorts }}
        {{- if ne .Protocol "UDP" }}
        - containerPort: {{.Port}}
          name: {{if .Name}}{{.Name}}{{else}}port-{{.Port}}{{end}}
          protocol: {{.Protocol}}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: shadow-node
          mountPath: /interlink/node
          readOnly: true
        {{- if eq .SSH.Auth "kerberos" }}
        - name: shadow-krb5cc
          mountPath: /interlink/krb5cc
          readOnly: true
        {{- if .SSH.Krb5ConfigMap }}
        - name: shadow-krb5-config
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
        {{- end }}
        {{- else }}
        - name: shadow-ssh-key
          mountPath: /interlink/ssh
          readOnly: true
        {{- end }}
        {{- if .SSH.KnownHostsConfigMap }}
        - name: shadow-known-hosts
          mountPath: /interlink/known-hosts
          readOnly: true
        {{- end }}
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      {{- end }}
      {{- if .Reverse }}
      # Connections opened BY the offloaded pod towards cluster endpoints, with no
      # WireGuard and no network namespace (interlink-hq/interLink#548).
      #
      # The job runs a relay on the pod's loopback address that accepts only the
      # job's user and, for each connection, dials a unix socket in the pod's socket
      # directory. This container binds those sockets with `ssh -R` on an sshd of
      # the compute node, so every connection made there is dialled from here,
      # inside the cluster. That sshd is the node's own (Reverse.Sshd "node"), or a
      # `sshd -i` started in the job as the job's user, over the stdio of a command
      # run through the login node ("userspace").
      - name: ssh-reverse
        image: {{.SSH.Image}}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -u
            read_node() { tr -d '[:space:]' < /interlink/node/{{.NodeNameKey}} 2>/dev/null || true; }
            read_sockdir() { tr -d '[:space:]' < /interlink/node/{{.SocketDirKey}} 2>/dev/null || true; }

            target={{.SSH.User}}@{{.SSH.LoginHost}}
            {{- if or (eq .SSH.ForwardMode "exec") (eq .Reverse.NodeExec "srun") }}
            connect_cmd='{{.SSH.ExecConnectCommand}}'
            {{- end }}
            w=/tmp/interlink-reverse
            {{ template "sshOptions" . }}
            ssh_opts="$ssh_opts -o LogLevel=ERROR"

            {{ template "nodeHop" . }}

            pid=
            socks_pid=
            socks_t=0

            # One -R per forward, to the socket the job's relay dials.
            build_rflags() {
              rflags=
              held="[ -d $sd ]"
              for f in $REV_FORWARDS; do
                lport=${f%%:*}
                dest=${f#*:}
                rflags="$rflags -R $sd/rev-$lport.sock:$dest"
                held="$held && [ -S $sd/rev-$lport.sock ]"
              done
              # A session holds its forwards until the job removes its directory; the
              # one holding the sockets also ends when one is gone, as after a requeue
              # on the same node recreated the directory, so that they are bound again.
              # The echo ends it with SIGPIPE once its sshd is gone, so a dropped
              # session leaves nothing behind on the node.
              hold="while $held; do sleep 10; echo; done"
              hold_dir="while [ -d $sd ]; do sleep 10; echo; done"
            }
            {{- if eq .Reverse.Sshd "node" }}

            # Starts a session running the hold command $1 with the -R flags that
            # follow, in the background.
            session() {
              h=$1
              shift
              # shellcheck disable=SC2086
              ssh -n -T -o ExitOnForwardFailure=yes $node_opts "$@" "{{.SSH.User}}@$node" "$h" >/dev/null &
            }

            start_reverse() {
              rm -rf "$w"
              mkdir -p "$w"
              {{ template "nodeOptions" . }}
              node_hop "$REV_NODE_EXEC" || return 1
              build_rflags

              # The node's sshd keeps a stale socket (StreamLocalBindUnlink no) and -R is
              # requested before any command runs: clear them in a session of their own.
              # shellcheck disable=SC2086
              ssh -n $node_opts "{{.SSH.User}}@$node" "rm -f $sd/rev-*.sock" || { echo "could not clear $sd on $node" >&2; return 1; }
              # shellcheck disable=SC2086
              session "$hold" $rflags
              pid=$!
            }
            {{- else }}

            # Starts a session running the hold command $1 with the -R flags that
            # follow, in the background, on an sshd -i of its own.
            session() {
              h=$1
              shift
              ssh -n -T \
                -o ProxyCommand="$w/proxy.sh" \
                -o ExitOnForwardFailure=yes \
                -o BatchMode=yes \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
                -o UserKnownHostsFile="$w/known_hosts" -o StrictHostKeyChecking=yes -o HostKeyAlias=interlink-job \
                -o GSSAPIAuthentication=no -o PreferredAuthentications=publickey \
                -i "$w/client" -o IdentitiesOnly=yes \
                "$@" {{.SSH.User}}@interlink-job "$h" >/dev/null &
            }

            start_reverse() {
              rm -rf "$w"
              mkdir -p "$w"
              {{ template "nodeOptions" . }}

              # A fresh key pair for each side on every start: nothing here outlives
              # the session, and nothing is taken from the site credential.
              ssh-keygen -q -t ed25519 -N '' -C interlink-reverse -f "$w/client"
              ssh-keygen -q -t ed25519 -N '' -C interlink-reverse -f "$w/host"
              echo "interlink-job $(cat "$w/host.pub")" > "$w/known_hosts"

              {
                echo "umask 077; cd $sd || exit 1; rm -f rev-*.sock rev-host rev-authorized_keys rev-sshd_config"
                echo "cat > rev-host <<'EOK'"; cat "$w/host"; echo EOK
                echo "cat > rev-authorized_keys <<'EOK'"; cat "$w/client.pub"; echo EOK
                echo "cat > rev-sshd_config <<'EOK'"
                echo "HostKey $sd/rev-host"
                echo "AuthorizedKeysFile $sd/rev-authorized_keys"
                echo "PidFile none"
                echo "UsePAM no"
                echo "StrictModes no"
                echo "PasswordAuthentication no"
                echo "KbdInteractiveAuthentication no"
                echo "PubkeyAuthentication yes"
                echo "AllowTcpForwarding remote"
                echo "AllowStreamLocalForwarding remote"
                echo "StreamLocalBindUnlink yes"
                echo "StreamLocalBindMask 0177"
                echo "AllowAgentForwarding no"
                echo "PermitTTY no"
                echo "X11Forwarding no"
                echo EOK
              } > "$w/bootstrap.sh"

              # srun goes through Slurm; ssh goes through the same checked hop as the
              # node's own sshd would.
              if [ "$REV_NODE_EXEC" = srun ]; then
                job_id || return 1
                run="ssh $ssh_opts $target srun --jobid=$jid --overlap -u -n1 -w $bhost --cpus-per-task=1"
              else
                node_hop ssh || return 1
                run="ssh $node_opts {{.SSH.User}}@$node"
              fi
              # shellcheck disable=SC2086
              $run "sh -s" < "$w/bootstrap.sh" || { echo "could not prepare $sd on $node" >&2; return 1; }
              printf '#!/bin/sh\nexec %s "%s -i -e -f %s/rev-sshd_config"\n' "$run" "$REV_SSHD" "$sd" > "$w/proxy.sh"
              chmod +x "$w/proxy.sh"
              build_rflags

              # shellcheck disable=SC2086
              session "$hold" $rflags
              pid=$!
            }
            {{- end }}

            # SOCKS has no unix-socket form, so it listens on the node's 127.0.0.1,
            # where another user can take the port while the tunnel is down. It runs in
            # a session of its own, retried every 30s, so that a failed SOCKS forward
            # never takes the listed forwards down with it.
            keep_socks() {
              [ -n "$REV_SOCKS_PORT" ] || return 0
              if [ -n "$socks_pid" ] && kill -0 "$socks_pid" 2>/dev/null; then
                return 0
              fi
              now=$(date +%s)
              [ $((now - socks_t)) -ge 30 ] || return 0
              if [ -n "$socks_pid" ]; then
                echo "the SOCKS forward on $node is down (is 127.0.0.1:$REV_SOCKS_PORT taken?); retrying" >&2
              fi
              socks_t=$now
              session "$hold_dir" -R "127.0.0.1:$REV_SOCKS_PORT"
              socks_pid=$!
            }

            stop_reverse() {
              for p in $pid $socks_pid; do
                kill "$p" 2>/dev/null || true
              done
              wait 2>/dev/null || true
              pid=
              socks_pid=
              socks_t=0
            }

            # A requeued job comes back on a different host, and the virtual kubelet
            # republishes the node and the socket directory into the mounted ConfigMap.
            moved() {
              cur=$(read_node)
              cur_sd=$(read_sockdir)
              [ -n "$cur" ] || return 1
              [ "$cur" != "$node" ] || { [ -n "$cur_sd" ] && [ "$cur_sd" != "$sd" ]; }
            }

            node=$(read_node)
            sd=$(read_sockdir)
            [ -n "$node" ] || { echo "no compute node recorded" >&2; exit 1; }
            [ -n "$sd" ] || { echo "no socket directory reported: set SocketDirRoot in the plugin" >&2; exit 1; }

            while :; do
              echo "reverse tunnel on $node through {{.SSH.LoginHost}} ({{.Reverse.Sshd}} sshd, $REV_NODE_EXEC carrier): $REV_FORWARDS"
              if [ -n "$REV_SOCKS_PORT" ]; then
                echo "WARNING: SOCKS proxy on 127.0.0.1:$REV_SOCKS_PORT on $node, open to every user of that node" >&2
              fi
              if start_reverse; then
                while kill -0 "$pid" 2>/dev/null && ! moved; do
                  keep_socks
                  sleep 10
                done
              fi
              stop_reverse

              if moved; then
                echo "compute node or socket directory changed, rebuilding the reverse tunnel"
                node=$cur
                [ -n "$cur_sd" ] && sd=$cur_sd
                continue
              fi
              # The session ends with the job, and a requeued job does not run on $node
              # yet: retry here rather than crash-loop into minutes of back-off.
              echo "the reverse tunnel to $node is down; retrying in 30s" >&2
              sleep 30
            done
        env:
        - name: REV_FORWARDS
          value: "{{range $i, $f := .Reverse.Forwards}}{{if $i}} {{end}}{{$f.ListenPort}}:{{$f.Host}}:{{$f.Port}}{{end}}"
        - name: REV_SOCKS_PORT
          value: "{{if .Reverse.SocksPort}}{{.Reverse.SocksPort}}{{end}}"
        - name: REV_NODE_EXEC
          value: "{{.Reverse.NodeExec}}"
        - name: REV_JOB_NAME
          value: "{{.Reverse.JobName}}"
        {{- if eq .Reverse.Sshd "userspace" }}
        - name: REV_SSHD
          value: "{{.Reverse.SshdPath}}"
        {{- end }}
        {{- if eq .SSH.Auth "kerberos" }}
        - name: KRB5CCNAME
          value: FILE:/interlink/krb5cc/ccache
        {{- end }}
        volumeMounts:
        - name: shadow-node
          mountPath: /interlink/node
          readOnly: true
        {{- if eq .SSH.Auth "kerberos" }}
        - name: shadow-krb5cc
          mountPath: /interlink/krb5cc
          readOnly: true
        {{- if .SSH.Krb5ConfigMap }}
        - name: shadow-krb5-config
          mountPath: /etc/krb5.conf
          subPath: krb5.conf
          readOnly: true
        {{- end }}
        {{- else }}
        - name: shadow-ssh-key
          mountPath: /interlink/ssh
          readOnly: true
        {{- end }}
        {{- if .SSH.KnownHostsConfigMap }}
        - name: shadow-known-hosts
          mountPath: /interlink/known-hosts
          readOnly: true
        {{- end }}
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      {{- end }}
      volumes:
      # Mounted as a directory, not subPath: only directory mounts are refreshed in
      # place when the VK writes the compute node into this ConfigMap.
      - name: shadow-node
        configMap:
          name: {{.NodeConfigMap}}
      {{- if eq .SSH.Auth "kerberos" }}
      - name: shadow-keytab
        secret:
          secretName: {{.SSH.KeytabSecret}}
          defaultMode: 0400
      - name: shadow-krb5cc
        emptyDir:
          medium: Memory
      {{- if .SSH.Krb5ConfigMap }}
      - name: shadow-krb5-config
        configMap:
          name: {{.SSH.Krb5ConfigMap}}
      {{- end }}
      {{- else }}
      - name: shadow-ssh-key
        secret:
          secretName: {{.SSH.KeySecret}}
          defaultMode: 0400
      {{- end }}
      {{- if .SSH.KnownHostsConfigMap }}
      - name: shadow-known-hosts
        configMap:
          name: {{.SSH.KnownHostsConfigMap}}
      {{- end }}
{{- if $hasTCP }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{.Name}}
  ports:
  {{- range .ExposedPorts }}
  {{- if ne .Protocol "UDP" }}
  - port: {{.Port}}
    targetPort: {{.Port}}
    name: {{if .Name}}{{.Name}}{{else}}port-{{.Port}}{{end}}
    protocol: {{.Protocol}}
  {{- end }}
  {{- end }}
{{- end }}
