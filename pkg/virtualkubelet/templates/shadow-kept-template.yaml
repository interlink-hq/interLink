apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{.Name}}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{.Name}}
    spec:
      # The containers the pod keeps on the cluster are added by the virtual kubelet;
      # pause keeps the pod running when it keeps only init containers.
      # A real node (the virtual one is kubernetes.io/os=virtual-kubelet), whatever the
      # pod tolerated.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      containers:
{{- if not .LocalContainers }}
      - name: {{.PauseName}}
        image: {{.PauseImage}}
        imagePullPolicy: IfNotPresent
{{- end }}
